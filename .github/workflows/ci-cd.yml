name: Laravel CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # TAHAP 1: CI (Continuous Integration - Automated Testing)
  # ========================================================
  tests:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚙️ Setup Environment (.env)
        run: cp .env.example .env

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: 🔑 Generate Application Key
        run: php artisan key:generate

      - name: 🎨 Install & Build Frontend Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Run PHPUnit Tests
        run: php artisan test

  # ========================================================
  # TAHAP 2: CD (Continuous Delivery - Docker to GitHub Packages)
  # ========================================================
  publish-package:
    name: 📦 Build & Publish Docker Image
    needs: tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Format nama repo ke lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login ke GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: 🚀 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
